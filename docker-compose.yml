version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cookbook-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - /volume1/docker/cookbook-postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend, MCP-Server und nginx (Frontend-Auslieferung) in einem Container.
  # docker/start.sh installiert bei jedem Start die Abhängigkeiten in die
  # Named Volumes, baut die drei Pakete aus dem eingehängten Quellcode, spielt
  # offene Prisma-Migrationen ein und startet die Prozesse.
  app:
    image: node:22-bookworm-slim
    container_name: cookbook-app
    restart: unless-stopped
    working_dir: /app
    ports:
      # nginx: Website inkl. /api, /mcp und OAuth-Metadaten
      - "${FRONTEND_PORT:-3002}:80"
      # Backend direkt (api.cookbook.gout-diary.com, Android-App)
      - "${BACKEND_PORT:-4002}:${BACKEND_PORT:-4002}"
    volumes:
      - /volume1/nodejs/cookbook:/app
      - backend_node_modules:/app/backend/node_modules
      - frontend_node_modules:/app/frontend/node_modules
      - mcp_node_modules:/app/mcp/node_modules
      - mcp_data:/data
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ---- Backend
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${BACKEND_PORT:-4002}
      NODE_ENV: ${NODE_ENV:-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cookbook.gout-diary.com,http://localhost:3002}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # ---- MCP-Server (spricht das Backend im selben Container an)
      COOKBOOK_API_URL: ${MCP_COOKBOOK_API_URL:-http://127.0.0.1:4002}
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 127.0.0.1
      MCP_HTTP_PORT: ${MCP_PORT:-4003}
      # Öffentliche Adresse der Website — daraus baut der Server seine
      # OAuth-Metadaten und die Rücksprungadressen.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://cookbook.gout-diary.com}
      MCP_DATA_DIR: /data
    command: bash /app/docker/start.sh
    healthcheck:
      # Über nginx bis zum Backend durch; der Build am Start dauert Minuten.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

volumes:
  backend_node_modules:
  frontend_node_modules:
  mcp_node_modules:
  mcp_data:
