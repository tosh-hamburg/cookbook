version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cookbook-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - /volume1/docker/cookbook-postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-slim
    container_name: cookbook-backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${BACKEND_PORT:-4002}:${BACKEND_PORT:-4002}"
    volumes:
      - /volume1/nodejs/cookbook/backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${BACKEND_PORT:-4002}
      NODE_ENV: ${NODE_ENV:-development}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cookbook.gout-diary.com,http://localhost:3002}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    command: sh -c "apt-get update && apt-get install -y openssl && npm install && npx prisma generate && npm run dev"

  frontend:
    image: node:20-slim
    container_name: cookbook-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-3002}:${FRONTEND_PORT:-3002}"
    volumes:
      - /volume1/nodejs/cookbook/frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT:-3002}"
    depends_on:
      - backend
      # Der Frontend-Container leitet /mcp weiter; ohne den Dienst laeuft die
      # Website zwar, der MCP-Endpunkt aber nicht.
      - mcp

  mcp:
    image: node:22-slim
    container_name: cookbook-mcp
    restart: unless-stopped
    working_dir: /app
    # Kein ports-Eintrag: Der Endpunkt ist ausschließlich über den
    # Frontend-Container erreichbar, der /mcp auf diesen Dienst weiterleitet.
    # Damit liegt er unter cookbook.gout-diary.com/mcp hinter demselben HTTPS.
    expose:
      - "${MCP_PORT:-4003}"
    volumes:
      - /volume1/nodejs/cookbook/mcp:/app
      - mcp_node_modules:/app/node_modules
      - mcp_data:/data
    depends_on:
      - backend
    environment:
      # Der MCP-Server spricht die Backend-API im Docker-Netz an.
      COOKBOOK_API_URL: ${MCP_COOKBOOK_API_URL:-http://backend:4002}
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: ${MCP_PORT:-4003}
      # Öffentliche Adresse der Website — daraus baut der Server seine
      # OAuth-Metadaten und die Rücksprungadressen.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://cookbook.gout-diary.com}
      # Dieselbe Client-ID wie die Website; die Anmeldeseite läuft auf derselben Origin.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MCP_DATA_DIR: /data
    command: sh -c "npm install && npm run build && npm start"

volumes:
  backend_node_modules:
  frontend_node_modules:
  mcp_node_modules:
  mcp_data:
