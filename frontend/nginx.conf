# Produktions-Auslieferung des Frontends.
#
# Ersetzt den bisherigen Vite-Dev-Server: Ausgeliefert wird der fertige Build
# aus frontend/dist, und derselbe Server verteilt die Pfade an Backend und
# MCP-Server. Damit verschwindet die gesamte Angriffsfläche des Dev-Servers
# (Source-Maps, server.fs-Zugriffe, Build-Tooling im laufenden Betrieb).
#
# Die Weiterleitungen entsprechen exakt denen, die vorher in vite.config.ts
# standen — ohne sie wäre /mcp nicht mehr erreichbar.

# Der Synology-Reverse-Proxy terminiert TLS und reicht http weiter. Wenn er
# X-Forwarded-Proto setzt, übernehmen wir es; sonst gilt unser eigenes Schema.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dockers eingebauter DNS. Zusammen mit den Variablen unten löst nginx die
    # Ziel-Container bei jeder Anfrage neu auf. Ohne das merkt sich nginx die
    # IP vom Start und liefert 502, sobald ein Container einzeln neu startet
    # und eine andere IP bekommt.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host "cookbook-backend:4002";
    set $mcp_host "cookbook-mcp:4003";

    # Base64-Bilder in Rezepten machen Anfragen groß; das Backend erlaubt 25 MB.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------- Backend
    location /api/ {
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_pass http://$backend_host$request_uri;
    }

    # ------------------------------------------------------------ MCP-Server
    location /mcp {
        include /etc/nginx/conf.d/proxy-headers.inc;
        # Antworten unverzögert durchreichen, damit auch ein späterer
        # SSE-Betrieb ohne Änderung funktioniert.
        proxy_buffering off;
        proxy_pass http://$mcp_host$request_uri;
    }

    # OAuth-Metadaten müssen laut RFC 8414 und RFC 9728 im Root liegen.
    location /.well-known/oauth-authorization-server {
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_pass http://$mcp_host$request_uri;
    }

    location /.well-known/oauth-protected-resource {
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_pass http://$mcp_host$request_uri;
    }

    # ------------------------------------------------------------- Statisches
    # Vite vergibt gehashte Dateinamen, deshalb ist dauerhaftes Caching sicher.
    location /assets/ {
        # Nur eine Cache-Control-Kopfzeile setzen: "expires" wuerde eine
        # zweite erzeugen, und Zwischenspeicher werten dann uneinheitlich aus.
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Die Einstiegsseite darf nie aus dem Cache kommen, sonst zeigen Browser
    # nach einem Deploy weiter auf alte Asset-Namen.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-Page-App: unbekannte Pfade an index.html, damit Deep-Links gehen.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
